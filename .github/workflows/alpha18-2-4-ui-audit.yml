name: Alpha18.2.4 UI Polish Audit
on:
  push:
    branches: [dev-plugins-alpha18.2.4-ui-polish]
  pull_request:
    branches: [dev-plugins]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          set -euxo pipefail
          node --check web/app.js
          test "$(cat VERSION)" = '0.1.0-alpha18.2.4-dev'
      - name: Settings layout guards
        run: |
          set -euxo pipefail
          grep -q "textContent = 'WEBUI'" web/app.js
          grep -q "display.enabled" web/app.js
          grep -q "display.brightness" web/app.js
          grep -q "display.idle_timeout_s" web/app.js
          grep -q "display.address" web/app.js
          grep -q "oledRuntimeSettingsCard" web/app.js
      - name: Updater checking animation guards
        run: |
          set -euxo pipefail
          grep -q "ywd-checking" web/app.js
          grep -q "aria-busy" web/app.js
          grep -q "ywd-check-spin" web/app.js
          grep -q "ywd-check-pulse" web/app.js
          grep -q "ywd-check-scan" web/app.js
          grep -q "prefers-reduced-motion" web/app.js
