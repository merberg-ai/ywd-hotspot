name: Alpha18.2.7 Hero Audit
on:
  push:
    branches: [dev-plugins-alpha18.2.7-hero]
  pull_request:
    branches: [dev-plugins]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          set -euxo pipefail
          python3 -m py_compile lib/dashboard.py
          node --check web/app.js
          test "$(cat VERSION)" = '0.1.0-alpha18.2.7-dev'
      - name: Confirm-first Save and Apply
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('web/app.js').read_text()
          a=s.index("confirm('Save and apply these settings now?")
          b=s.index("post('/api/config/save'", a)
          c=s.index("post('/api/config/apply'", b)
          assert a < b < c
          assert "Save & Apply canceled — nothing changed" in s
          assert "button.onclick = async () =>" in s
          PY
      - name: Hero asset and CSP-safe styles
        run: |
          set -euxo pipefail
          test -s assets/branding/ywd-hotspot-banner-webui.webp
          test "$(stat -c %s assets/branding/ywd-hotspot-banner-webui.webp)" -gt 10000
          python3 - <<'PY'
          from pathlib import Path
          b=Path('assets/branding/ywd-hotspot-banner-webui.webp').read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP'
          PY
          grep -q 'assets/branding/ywd-hotspot-banner-webui.webp' MANIFEST.txt
          grep -q '/ywd-hotspot-banner.webp' lib/dashboard.py
          grep -q 'ywd-hero-banner' web/app.js
          grep -q 'ywd-hero-topbar' web/ui-polish.css
          ! grep -q "createElement('style')" web/app.js
          ! grep -q 'style.textContent' web/app.js
      - name: Scope guard
        run: |
          set -euxo pipefail
          git diff --name-only HEAD^1 HEAD | sort
          bad="$(git diff --name-only HEAD^1 HEAD | grep -Ev '^(VERSION|MANIFEST.txt|assets/branding/ywd-hotspot-banner-webui.webp|lib/dashboard.py|web/app.js|web/ui-polish.css|.github/workflows/alpha18-2-7-hero-audit.yml)$' || true)"
          test -z "$bad"
