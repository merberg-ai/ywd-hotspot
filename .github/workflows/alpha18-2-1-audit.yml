name: Alpha18.2.1 OLED and Migration UI Audit
on:
  push:
    branches: [dev-plugins-alpha18.2.1-polish]
  pull_request:
    branches: [dev-plugins]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          set -euxo pipefail
          python3 -m py_compile lib/admin.py lib/settings_admin.py lib/settings_backup.py
          bash -n lib/oled_owner.sh UPDATE.sh
          node --check web/backup-restore.js
          node --check web/app.js
      - name: OLED owner guards
        run: |
          set -euxo pipefail
          grep -q 'systemctl enable ywd-headless-oled.service' lib/oled_owner.sh
          grep -q 'systemctl disable --now ywd-oled.service' lib/oled_owner.sh
          grep -q 'return "ywd-headless-oled.service" if unit_exists' lib/admin.py
          grep -q 'apply_oled_policy(enabled)' lib/admin.py
          grep -q 'authoritative OLED owner helper is missing' lib/admin.py
          grep -q 'ywd-headless-oled.service", "ywd-oled.service"' lib/admin.py
      - name: Backup modal feedback guards
        run: |
          set -euxo pipefail
          grep -q 'backupModalFeedback' web/backup-restore.js
          grep -q 'modalError' web/backup-restore.js
          grep -q 'ywd-working' web/backup-restore.js
          grep -q 'backupProgress' web/backup-restore.js
          grep -q 'Decrypting and authenticating backup' web/backup-restore.js
          grep -q 'Applying configuration and reconciling services' web/backup-restore.js
          grep -q 'backup-progress-bar' web/backup-restore.css
          grep -q 'alpha18.2.1' web/app.js
          test "$(cat VERSION)" = '0.1.0-alpha18.2.1-dev'
      - name: Alpha18.2 trust boundary unchanged
        run: |
          set -euxo pipefail
          grep -q 'scrypt' lib/settings_backup.py
          grep -q 'AES-256-CBC' docs/BACKUP-RESTORE.md
          grep -q 'uploaded service plugins require a trusted Ed25519 signature' lib/plugin_package_archive.py
          grep -q 'PrivateDevices=true' systemd/ywd-plugin@.service
